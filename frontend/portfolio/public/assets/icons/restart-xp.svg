<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- XP Green Button Gradient -->
    <linearGradient id="xp-restart-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#73c822"/>
      <stop offset="12%" stop-color="#55b512"/>
      <stop offset="50%" stop-color="#239304"/>
      <stop offset="85%" stop-color="#0a7a00"/>
      <stop offset="100%" stop-color="#076000"/>
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="xp-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Spokes -->
    <filter id="spoke-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#054500" flood-opacity="0.75"/>
    </filter>

    <!-- Outer Button Shadow -->
    <filter id="btn-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Capsule Spoke Definition -->
    <g id="spoke">
      <!-- Radiating vertical bar pointing upward from center distance -->
      <rect x="-8.5" y="-62" width="17" height="35" rx="8.5" ry="8.5" fill="#ffffff" filter="url(#spoke-shadow)"/>
    </g>
  </defs>

  <!-- Green Rounded Square Tile -->
  <rect x="16" y="16" width="168" height="168" rx="28" ry="28" fill="url(#xp-restart-bg)" stroke="#1a6e00" stroke-width="2.5" filter="url(#btn-shadow)"/>

  <!-- Subtle Inner Top Highlight -->
  <rect x="19" y="19" width="162" height="70" rx="25" ry="25" fill="url(#xp-gloss)" />

  <!-- 8 Rotated Spokes forming the classic XP Asterisk/Sunburst -->
  <g transform="translate(100, 100)">
    <use href="#spoke" transform="rotate(0)"/>
    <use href="#spoke" transform="rotate(45)"/>
    <use href="#spoke" transform="rotate(90)"/>
    <use href="#spoke" transform="rotate(135)"/>
    <use href="#spoke" transform="rotate(180)"/>
    <use href="#spoke" transform="rotate(225)"/>
    <use href="#spoke" transform="rotate(270)"/>
    <use href="#spoke" transform="rotate(315)"/>
  </g>
</svg>
